<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY NOW - Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<header class="cabecera-login">
    <a href="/index.html" class="btn-volver">&#8592; Volver a la tienda</a>

    <a href="/index.html" class="logo-enlace">+
        <h1>PLAY NOW</h1>
    </a>

    <div class="espaciador"></div>
</header>

<main class="contenedor-login">
    <section class="tarjeta-formulario">
        <h2>Iniciar Sesión</h2>
        <p class="subtitulo">Accede a tu panel de gestión</p>

        <form action="/crud.html" method="get">

            <div class="grupo-input">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="opciones-extra">
                <label>
                    <input type="checkbox" name="recordar"> Recordar mi cuenta
                </label>
                <a href="#" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-ingresar">INGRESAR AHORA</button>
        </form>

        <div class="pie-formulario">
            <p>¿No tienes una cuenta de Play Now? <a href="#">Regístrate</a></p>
        </div>
    </section>
</main>

</body>
</html>
